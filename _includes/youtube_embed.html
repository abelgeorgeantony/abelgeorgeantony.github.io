<!-- _includes/youtube.html -->
<style>
  .video-wrapper {
    width: 100%;
    cursor: none;
  }
  
  .video-wrapper iframe {
    width: 100%;
    height: calc(100vh - 2ch);
    border: none; /* Replaces the deprecated frameborder="0" */
    cursor: none;
  }
</style>

<div class="video-wrapper">
  <iframe
          src="https://www.youtube-nocookie.com/embed/{{ include.id }}/?autoplay=1&mute=1" 
          title="YouTube video player" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
  </iframe>
</div>
